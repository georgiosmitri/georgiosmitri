name: Refresh profile
on:
  schedule:
    - cron: "17 5 * * *" # daily, 07:17 Cyprus time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update.mjs
        env:
          STATUS_REPOS: ${{ vars.STATUS_REPOS }}
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "profile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Refresh currently building and latest videos" && git push
