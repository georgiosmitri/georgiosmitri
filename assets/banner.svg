<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Georgios Mitri, I build products with AI</title>
  <desc id="d">Name and tagline above an edit timeline whose clips slide into place.</desc>
  <style>
    .name { font: 700 76px "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif; fill: #ece6d9; letter-spacing: -2px; }
    .tag  { font: 500 34px "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif; fill: #8da1b0; letter-spacing: -0.4px; }
    .meta { font: 600 18px "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; fill: #6cc4ae; }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .r2 { animation-delay: .25s; }
    .r3 { animation-delay: .5s; }
    .clip { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow .7s cubic-bezier(.2,.8,.2,1) forwards; }
    .c1 { animation-delay: .9s; } .c2 { animation-delay: 1.05s; } .c3 { animation-delay: 1.2s; } .c4 { animation-delay: 1.35s; } .c5 { animation-delay: 1.5s; } .c6 { animation-delay: 1.65s; }
    .head { animation: scrub 6s linear 2.2s infinite; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes scrub { from { transform: translateX(0); } to { transform: translateX(1040px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .clip { animation: none; opacity: 1; transform: none; }
      .head, .caret { animation: none; }
    }
  </style>
  <rect width="1200" height="320" rx="22" fill="#0d1b26"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="21.5" fill="none" stroke="#1b3349"/>

  <text class="meta rise" x="80" y="78">Based in Paphos, Cyprus</text>
  <text class="name rise r2" x="78" y="152">Georgios Mitri</text>
  <text class="tag rise r3" x="80" y="200">I build products with AI<tspan class="caret" fill="#6cc4ae">_</tspan></text>

  <!-- edit timeline: kept clips (verdigris), a cut (amber), captions track -->
  <g transform="translate(80 236)">
    <rect width="1040" height="2" y="15" fill="#1b3349"/>
    <rect class="clip c1" x="0"   y="4" width="170" height="24" rx="6" fill="#6cc4ae"/>
    <rect class="clip c2" x="178" y="4" width="96"  height="24" rx="6" fill="#6cc4ae" opacity=".8"/>
    <rect class="clip c3" x="282" y="4" width="54"  height="24" rx="6" fill="#e6b45e" opacity=".85"/>
    <rect class="clip c4" x="344" y="4" width="260" height="24" rx="6" fill="#6cc4ae"/>
    <rect class="clip c5" x="612" y="4" width="148" height="24" rx="6" fill="#6cc4ae" opacity=".8"/>
    <rect class="clip c6" x="768" y="4" width="272" height="24" rx="6" fill="#6cc4ae"/>
    <rect class="clip c2" x="0"   y="38" width="420" height="8" rx="4" fill="#1b3349"/>
    <rect class="clip c4" x="430" y="38" width="610" height="8" rx="4" fill="#1b3349"/>
    <g class="head">
      <rect x="-1" y="-6" width="2" height="58" fill="#ece6d9"/>
      <circle cx="0" cy="-8" r="5" fill="#ece6d9"/>
    </g>
  </g>
</svg>
